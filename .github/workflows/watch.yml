name: Watch dress stock

on:
  schedule: every 5m  # - cron: "*/5 * * * *"  # GitHub runs this roughly every 5-15 minutes
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
